<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">How ARMORY handles your data</title>
  <desc id="d">Your inventory, photos and logs stay on your device. AI features optionally send a photo or make and model to Groq using your own key, and the answer comes back. Backups never include the key.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E8C964"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="18" fill="#101216"/>
  <rect x="1" y="1" width="1198" height="558" rx="17" fill="none" stroke="#D4AF37" stroke-opacity=".3"/>
  <g font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif" fill="#ece8de">
    <text x="600" y="54" text-anchor="middle" font-size="30" letter-spacing="5" fill="#E8C964" font-family="'Bebas Neue','Impact',Arial,sans-serif">HOW ARMORY HANDLES YOUR DATA</text>

    <!-- device boundary -->
    <rect x="40" y="86" width="760" height="430" rx="14" fill="#16191f" stroke="#D4AF37" stroke-opacity=".6" stroke-dasharray="8 6"/>
    <text x="64" y="118" font-size="19" letter-spacing="3" fill="#E8C964">ON YOUR DEVICE</text>

    <rect x="70" y="150" width="200" height="120" rx="10" fill="#1d2129" stroke="#3a4150"/>
    <text x="170" y="190" text-anchor="middle" font-size="26" font-weight="700">1  Add or scan</text>
    <text x="170" y="220" text-anchor="middle" font-size="18" fill="#aab0ba">Camera, manual entry,</text>
    <text x="170" y="242" text-anchor="middle" font-size="18" fill="#aab0ba">or spreadsheet import</text>

    <rect x="330" y="150" width="200" height="120" rx="10" fill="#1d2129" stroke="#D4AF37" stroke-opacity=".7"/>
    <text x="430" y="190" text-anchor="middle" font-size="26" font-weight="700">2  Your vault</text>
    <text x="430" y="220" text-anchor="middle" font-size="18" fill="#aab0ba">Specs, photos, logs —</text>
    <text x="430" y="242" text-anchor="middle" font-size="18" fill="#aab0ba">stored locally</text>

    <rect x="590" y="150" width="190" height="120" rx="10" fill="#1d2129" stroke="#3a4150"/>
    <text x="685" y="190" text-anchor="middle" font-size="26" font-weight="700">3  Docs</text>
    <text x="685" y="220" text-anchor="middle" font-size="18" fill="#aab0ba">Insurance reports,</text>
    <text x="685" y="242" text-anchor="middle" font-size="18" fill="#aab0ba">bill of sale, checklists</text>

    <line x1="272" y1="210" x2="326" y2="210" stroke="#E8C964" stroke-width="3" marker-end="url(#ar)"/>
    <line x1="532" y1="210" x2="586" y2="210" stroke="#E8C964" stroke-width="3" marker-end="url(#ar)"/>

    <rect x="330" y="340" width="450" height="110" rx="10" fill="#1d2129" stroke="#3a4150"/>
    <text x="555" y="378" text-anchor="middle" font-size="24" font-weight="700">Backup &amp; restore (.json)</text>
    <text x="555" y="408" text-anchor="middle" font-size="18" fill="#aab0ba">One file restores everything. Your API key is never included.</text>
    <line x1="430" y1="272" x2="430" y2="336" stroke="#E8C964" stroke-width="3" marker-end="url(#ar)"/>

    <rect x="70" y="340" width="220" height="110" rx="10" fill="#1d2129" stroke="#3a4150"/>
    <text x="180" y="378" text-anchor="middle" font-size="24" font-weight="700">Works offline</text>
    <text x="180" y="408" text-anchor="middle" font-size="18" fill="#aab0ba">Service worker caches</text>
    <text x="180" y="430" text-anchor="middle" font-size="18" fill="#aab0ba">the whole app</text>

    <!-- Groq -->
    <rect x="880" y="150" width="280" height="190" rx="14" fill="#16191f" stroke="#5b6475" stroke-dasharray="3 5"/>
    <text x="1020" y="186" text-anchor="middle" font-size="19" letter-spacing="3" fill="#aab0ba">OPTIONAL · GROQ</text>
    <text x="1020" y="226" text-anchor="middle" font-size="24" font-weight="700">AI identify &amp; spec fill</text>
    <text x="1020" y="256" text-anchor="middle" font-size="18" fill="#aab0ba">Uses your own free key.</text>
    <text x="1020" y="280" text-anchor="middle" font-size="18" fill="#aab0ba">Only runs when you tap</text>
    <text x="1020" y="304" text-anchor="middle" font-size="18" fill="#aab0ba">a scan or AI button.</text>

    <path d="M272 160 C 360 100, 760 100, 876 190" fill="none" stroke="#E8C964" stroke-width="3" stroke-dasharray="2 6" marker-end="url(#ar)"/>
    <text x="1020" y="128" text-anchor="middle" font-size="17" fill="#E8C964">photo or make/model sent</text>
    <path d="M880 300 C 780 330, 640 320, 536 262" fill="none" stroke="#E8C964" stroke-width="3" stroke-dasharray="2 6" marker-end="url(#ar)"/>
    <text x="1020" y="372" text-anchor="middle" font-size="17" fill="#E8C964">specs + description returned</text>

    <text x="600" y="545" text-anchor="middle" font-size="17" fill="#8b93a1">No ARMORY server. No accounts. No tracking.</text>
  </g>
</svg>
